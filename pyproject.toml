[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-implementation-exchange"
version = "0.1.0"
description = "Inspectable offline transaction for scoped AI support implementations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "A2Z SOC"}]
dependencies = []

[project.scripts]
a2z-implementation-exchange = "implementation_exchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
