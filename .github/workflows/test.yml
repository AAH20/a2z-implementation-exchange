name: Test
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Demo and offline verification
        run: |
          PYTHONPATH=src python -m implementation_exchange.cli demo
          PYTHONPATH=src python -m implementation_exchange.cli verify generated/support-transaction.json
      - name: Check fixture regeneration
        run: |
          python examples/generate_cases.py
          git diff --exit-code examples/cases.json
